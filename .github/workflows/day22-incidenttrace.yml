name: Day 22 IncidentTrace tests
on:
  push:
    paths:
      - "day22-incidenttrace/**"
      - ".github/workflows/day22-incidenttrace.yml"
  pull_request:
    paths:
      - "day22-incidenttrace/**"
      - ".github/workflows/day22-incidenttrace.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day22-incidenttrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
